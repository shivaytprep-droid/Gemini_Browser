name: Build AI Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" release_apk/AI_Agent_Browser_Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Browser-APK
          path: release_apk/AI_Agent_Browser_Debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "AI Agent Browser v2.0.${{ github.run_number }}"
          files: release_apk/AI_Agent_Browser_Debug.apk
          generate_release_notes: true
